<html lang="en">
<head><link rel="icon" href="../ASSETS/favicon.ico">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <script src="../INDEX-JS/demo-model.js"></script>
  <script src="../INDEX-JS/demo-api.js"></script>
  <script src="../INDEX-JS/safe-actions.js"></script>
  <meta charset="UTF-8" />
  <title>Shift Weekly Overview</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #87e8cb, #e9ffe8);
      text-align: center;
      padding: 20px;
    }

    #motdBanner {
      background: #ffcc00;
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    input[type="date"] {
      padding: 5px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: auto;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background-color: rgba(255, 255, 255, 0.95);
    }

    #shiftButton {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      width: 10%;
      margin-left: auto;
      margin-right: auto;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 5px;
      text-align: center;
      font-size: 12px;
    }

    th.day-header {
      background-color: #0fc044;
      color: white;
    }

    td.time-label {
      background-color: #e0e0e0;
      font-weight: bold;
    }

    #nam {
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      font-weight: bold;
      color: #000;
    }

    .alt-day {
      background-color: #f0f0f0;
    }

    #weeklyTotals {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      width: 30%;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    #totalsList {
      list-style: none;
      padding: 0;
      margin-top: 10px;
      text-align: left;
    }

    #totalsList li {
      margin-bottom: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Shift Weekly Overview</h1>
  <div id="motdBanner">Message of the Day: You're doing great :D</div>

  <label for="weekPicker"><strong>Select any date:</strong></label>
  <input type="date" id="weekPicker" />
  <a href="ShiftCreation_integration.html">
    <button id="shiftButton" class="button">Create New Shift</button>
  </a>

  <table>
    <thead>
      <tr>
        <th rowspan="2">Time</th>
        <th class="day-header" colspan="12">Monday</th>
        <th class="day-header" colspan="12">Tuesday</th>
        <th class="day-header" colspan="12">Wednesday</th>
        <th class="day-header" colspan="12">Thursday</th>
        <th class="day-header" colspan="12">Friday</th>
      </tr>
      <tr id="employeeHeaderRow">
        <!-- Filled by JS -->
      </tr>
    </thead>
    <tbody id="shiftTableBody">
      <!-- Generated by JS -->
    </tbody>
  </table>

  <div id="weeklyTotals">
    <h3>Total Hours This Week</h3>
    <ul id="totalsList"></ul>
  </div>

  
<script src="../INDEX-JS/page-weekly_schedule-8.js"></script>
</body>
</html>
